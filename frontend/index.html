<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsScope - AI News Summarization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .main-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 30px;
        }

        .result.active {
            display: block;
        }

        .result-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .result-item h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .result-item .summary {
            color: #555;
            line-height: 1.6;
            font-size: 1.05em;
        }

        .result-item .meta {
            margin-top: 10px;
            font-size: 0.9em;
            color: #888;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }

        .badge.duplicate {
            background: #ff6b6b;
            color: white;
        }

        .badge.unique {
            background: #51cf66;
            color: white;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .batch-input {
            margin-bottom: 20px;
        }

        .batch-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            position: relative;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .add-article-btn {
            background: #51cf66;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
        }

        .footer a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 NewsScope</h1>
            <p>AI-Powered News Summarization & Deduplication</p>
        </div>

        <!-- Stats Dashboard -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3>Total Processed</h3>
                <div class="value" id="totalProcessed">0</div>
            </div>
            <div class="stat-card">
                <h3>Duplicates Removed</h3>
                <div class="value" id="totalDuplicates">0</div>
            </div>
            <div class="stat-card">
                <h3>Avg Processing Time</h3>
                <div class="value" id="avgTime">0ms</div>
            </div>
            <div class="stat-card">
                <h3>Dedup Rate</h3>
                <div class="value" id="dedupRate">0%</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('single')">Single Article</button>
                <button class="tab" onclick="switchTab('batch')">Batch Processing</button>
            </div>

            <!-- Single Article Tab -->
            <div id="single-tab" class="tab-content active">
                <form id="singleForm" onsubmit="processSingle(event)">
                    <div class="input-group">
                        <label for="title">Article Title</label>
                        <input type="text" id="title" required placeholder="Enter article title...">
                    </div>
                    <div class="input-group">
                        <label for="content">Article Content</label>
                        <textarea id="content" required placeholder="Paste the full article text here..."></textarea>
                    </div>
                    <div class="input-group">
                        <label for="url">Article URL</label>
                        <input type="url" id="url" required placeholder="https://example.com/article">
                    </div>
                    <button type="submit" class="button" id="submitBtn">
                        ✨ Summarize Article
                    </button>
                </form>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: #667eea; font-weight: 600;">
                        Processing with AI...
                    </p>
                </div>

                <div class="error" id="error"></div>

                <div class="result" id="result"></div>
            </div>

            <!-- Batch Processing Tab -->
            <div id="batch-tab" class="tab-content">
                <button class="add-article-btn" onclick="addBatchArticle()">
                    ➕ Add Article
                </button>

                <div id="batchArticles"></div>

                <button class="button" onclick="processBatch()" id="batchBtn">
                    🚀 Process All Articles
                </button>

                <div class="loading" id="batchLoading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: #667eea; font-weight: 600;">
                        Processing batch...
                    </p>
                </div>

                <div class="error" id="batchError"></div>
                <div class="result" id="batchResult"></div>
            </div>
        </div>

        <div class="footer">
            <p>Built with ❤️ using FastAPI, Transformers & AI</p>
            <p><a href="https://github.com/yourusername/newsscope" target="_blank">View on GitHub</a></p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000'
        let batchCount = 0;

        //Load Stats on page load
        loadStats();
        setInterval(loadStats, 5000);

        async function loadStats(){
            try{
                const response = await fetch('${API_URL}/api/v1/metrics');
                const data = await response.json();

                document.getElementById('totalProcessed').textContent = data.total_proceseed;
                document.getElementById('totalDuplicates').textContent = data.total_duplicates;
                document.getElementById('avgTime').textContent =
                   `${data.avg_processing_time_ms.toFixed(0)}ms`;

                const dedupRate = data.total_processed > 0 
                ? (data.total_duplicates / data.total_processed * 100).toFixed(1)
                : 0;

                document.getElementById('dedupRate').textContent = `${dedupRate}%`;
            }catch(error){
                console.error('Error loading stats: ', error);
            }
        }

        function switchTab(tab){
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`${tab}-tab`).classList.add('active');
        }

        async function processSingle(event){
            event.preventDefault();

            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const url = document.getElementById('url').value;

            const loading = document.getELementById('loading');
            const result = document.getElementById('result');
            const error = document.getELementById('error');
            const submitBtn = document.getElementById('submitBtn');

            loading.classList.add('active');
            result.classList.remove('active');
            error.classList.remove('active');
            submitBtn.disabled = true;

            try{
                const response = await fetch(`${API_URL}/api/v1/summarize`, {
                    method: 'POST',
                    headers: {
                        'Content-Type' : 'application/json',
                    },
                    body: JSON.stringify({title, content, url}),
                });

                if(!response.ok){
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                result.innerHTML = `
                   <div class="result-item">
                        <h3>${data.title}</h3>
                        <div class="summary">${data.summary}</div>
                        <div class="meta">
                            Processing time: ${data.processing_time_ms.toFixed(2)}ms
                        </div>
                    </div>
                `;
                result.classList.add('active');

                loadStats();
            }catch(err){
                error.textContent = `Error: ${err.message}. Make sure the API is running!`;
                error.classList.add('active');
            }finally{
                loadong.classList.remove('active');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
